<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title description">
  <title id="title">QuickPods Phase 0C sanitized taskbar placement</title>
  <desc id="description">A coordinate-only diagram of the 3840 by 72 pixel primary taskbar. Widgets, a verified compact QuickPods placement, and Start do not overlap.</desc>
  <rect width="1200" height="220" fill="#0b1020" />
  <text x="24" y="30" fill="#f4f7ff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">Phase 0C — sanitized physical-pixel layout</text>
  <text x="24" y="50" fill="#9aa7bd" font-family="Segoe UI, sans-serif" font-size="12">Primary taskbar 3840×72 px / DPI 144 / details of non-landmark obstacles omitted</text>
  <rect x="24" y="82" width="1152" height="54" rx="10" fill="#1b2231" stroke="#4a566e" />
  <rect x="26.7" y="82" width="68.4" height="54" rx="7" fill="#34425d" stroke="#7f91b2" />
  <rect x="98.7" y="86.5" width="89.7" height="45" rx="8" fill="#143f46" stroke="#5ee7f2" stroke-width="2" />
  <rect x="351.3" y="82" width="20.4" height="54" rx="6" fill="#334f86" stroke="#80b7ff" />
  <line x1="347.7" y1="76" x2="347.7" y2="142" stroke="#5ee7f2" stroke-dasharray="3 3" />
  <text x="27" y="158" fill="#c8d3e8" font-family="Segoe UI, sans-serif" font-size="12">Widgets (9,0,228,72)</text>
  <text x="99" y="178" fill="#5ee7f2" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">QuickPods Compact (249,6,299,60)</text>
  <text x="340" y="158" fill="#a9cfff" font-family="Segoe UI, sans-serif" font-size="12">Start (1091,0,68,72)</text>
  <text x="24" y="207" fill="#7f8ca4" font-family="Segoe UI, sans-serif" font-size="11">The dashed line marks the 12 px safety margin before Start. This is not a desktop screenshot.</text>
</svg>
