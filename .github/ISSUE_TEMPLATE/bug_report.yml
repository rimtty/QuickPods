name: Bug report
description: Report a reproducible QuickPods defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials, account details, Bluetooth addresses, full Container/PnP/Endpoint IDs, and unrelated private information from logs and screenshots.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and how does it affect you?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start QuickPods...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only information relevant to reproduction.
      placeholder: |
        QuickPods version or commit:
        Windows edition and build:
        Display scale and taskbar alignment:
        Bluetooth device and driver (if relevant):
        Local console or Remote Desktop:
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Audio volume or mute
        - Bluetooth device list
        - Bluetooth connect or disconnect
        - Default audio output
        - Taskbar surface or flyout
        - Settings, startup, or tray
        - Installer, update, or uninstall
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostics
      description: Paste the smallest useful excerpt or attach reviewed screenshots.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I reproduced this with the latest release or current `main` build.
          required: true
        - label: I reviewed every attachment and removed private identifiers and secrets.
          required: true
        - label: This is not a security vulnerability; security reports follow `SECURITY.md`.
          required: true
