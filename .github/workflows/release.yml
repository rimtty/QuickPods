name: Signed release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version (for example 0.1.0-rc.1 or 0.1.0)
        required: true
        default: 0.1.0-rc.1
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  QUICKPODS_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  signed-release:
    name: Signed x64 per-user MSI
    runs-on: windows-2025
    timeout-minutes: 25
    environment: release-signing

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          architecture: x64
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: |
          dotnet restore QuickPods.sln --locked-mode
          dotnet restore installer/QuickPods.Setup/QuickPods.Setup.wixproj --locked-mode

      - name: Audit, format, build, and test
        run: |
          ./build/Test-DependencyVulnerabilities.ps1
          dotnet format QuickPods.sln --verify-no-changes --no-restore --severity warn --verbosity minimal
          dotnet build QuickPods.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet test QuickPods.sln -c Release --no-build --no-restore -- RunConfiguration.TreatNoTestsAsError=true

      - name: Decode signing certificate
        env:
          QUICKPODS_SIGNING_PFX_BASE64: ${{ secrets.QUICKPODS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QUICKPODS_SIGNING_PFX_BASE64)) {
              throw 'QUICKPODS_SIGNING_PFX_BASE64 is not configured in the release-signing environment.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'quickpods-signing.pfx'
          [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:QUICKPODS_SIGNING_PFX_BASE64))
          "QUICKPODS_SIGNING_PFX_PATH=$certificatePath" >> $env:GITHUB_ENV

      - name: Publish signed installer
        env:
          QUICKPODS_SIGNING_PFX_PASSWORD: ${{ secrets.QUICKPODS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QUICKPODS_SIGNING_PFX_PASSWORD)) {
              throw 'QUICKPODS_SIGNING_PFX_PASSWORD is not configured in the release-signing environment.'
          }
          ./build/Publish-ReleaseCandidate.ps1 `
              -OutputDirectory artifacts/rc `
              -Version $env:QUICKPODS_RELEASE_VERSION
          $password = ConvertTo-SecureString `
              $env:QUICKPODS_SIGNING_PFX_PASSWORD `
              -AsPlainText `
              -Force
          ./build/Publish-Installer.ps1 `
              -OutputDirectory artifacts/installer `
              -Version $env:QUICKPODS_RELEASE_VERSION `
              -PayloadDirectory artifacts/rc/QuickPods `
              -SkipPayloadPublish `
              -SkipRestore `
              -SigningCertificatePath $env:QUICKPODS_SIGNING_PFX_PATH `
              -SigningCertificatePassword $password `
              -RequireSignature

      - name: Remove signing certificate
        if: ${{ always() }}
        run: |
          if ($env:QUICKPODS_SIGNING_PFX_PATH -and
              (Test-Path -LiteralPath $env:QUICKPODS_SIGNING_PFX_PATH -PathType Leaf)) {
              Remove-Item -LiteralPath $env:QUICKPODS_SIGNING_PFX_PATH -Force
          }

      - name: Upload signed installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickpods-signed-per-user-msi
          path: |
            artifacts/installer/QuickPods-*-win-x64.msi
            artifacts/installer/SHA256SUMS.txt
            artifacts/installer/installer-manifest.json
            artifacts/installer/payload-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickpods-diagnostic-portable
          path: |
            artifacts/rc/QuickPods-*-win-x64.zip
            artifacts/rc/SHA256SUMS.txt
            artifacts/rc/QuickPods/artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
